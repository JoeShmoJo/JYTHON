or return reads the column matching its model element name and uses that day\u2019s scheduled flow. Element names must match the model; a missing column is an error."}}, "irrm": {"label": "IRRM", "settings": {"active": {"Detroit": true, "Hills Creek": true, "Lookout Point": true, "Cougar": true, "Big Cliff": false, "Blue River": false, "Cottage Grove": false, "Dexter": false, "Dorena": false, "Fall Creek": false, "Fern Ridge": false, "Foster": false, "Green Peter": false}, "target_elevation_ft": {"Detroit": 1558.5, "Hills Creek": 1531, "Lookout Point": 921, "Cougar": 1685, "Big Cliff": null, "Blue River": null, "Cottage Grove": null, "Dexter": null, "Dorena": null, "Fall Creek": null, "Fern Ridge": null, "Foster": null, "Green Peter": null}, "glide_days": 1}, "tables": {}, "help": {"purpose": "Reduce a reservoir\u2019s allowable operating pool through an Interim Risk Reduction Measure target.", "how_it_works": "Converts the target elevation to storage and proposes a minimum release to reduce excess storage over the glide period. Activation and target elevation can differ by reservoir."}}, "draft_to_rc": {"label": "Draft to Rule Curve", "settings": {"active": true, "days_lookahead": 3, "buffer_ac_ft": 50}, "tables": {}, "help": {"purpose": "Control releases so a pool above its rule curve approaches the curve without drafting too far.", "how_it_works": "Proposes a maximum release using the current rule curve and a lookahead target with a storage buffer. Activation can be global or set separately for each reservoir where this rule is attached."}}, "fill_lop_first": {"label": "Fill LOP First", "settings": {"high_flow_cfs": 800, "low_flow_cfs": 400, "start_month": 3, "start_day": 1, "end_month": 4, "end_day": 30, "spillway_elevation_ft": 890}, "tables": {}, "help": {"purpose": "Help Lookout Point fill by requesting additional upstream release during the spring window.", "how_it_works": "Uses Lookout Point\u2019s previous elevation and rule curve, capped by the spillway elevation, to choose a minimum release between the configured flow levels. This script explicitly names Lookout Point; using a different target reservoir would require a script change."}}, "hcr_lop_balance": {"label": "HCR / LOP Balance", "settings": {"start_month": 5, "end_month": 10, "minimum_conservation_elevation_ft": {"Hills Creek": 1448, "Lookout Point": 825}, "maximum_conservation_elevation_ft": {"Hills Creek": 1541, "Lookout Point": 926}, "highest_minimum_flow_cfs": 1800, "release_above_inflow_cfs": 300, "minimum_flow_low_limit_cfs": 800, "glide_days": 1, "lop_drawdown_rule_name": "Deep Drawdown"}, "tables": {}, "help": {"purpose": "Keep Hills Creek and Lookout Point at similar fractions of their conservation storage during the balancing season.", "how_it_works": "Uses their combined previous storage to calculate a target for Hills Creek, then proposes a minimum release subject to flow limits. Balancing stands down when Lookout Point\u2019s Deep Drawdown rule is operating. These two reservoirs are explicitly named in the script."}}}}</script>
<script>
let config=JSON.parse(document.getElementById('example').textContent), selected='overview', pendingCSV=null;
const $=id=>document.getElementById(id);
function node(tag,text){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function status(text){$('status').textContent=text;if(selected==='irrm'||selected==='deep_drawdown'){let old=document.getElementById('operating-state');if(old){let parent=old.parentNode;old.remove();drawOperatingStatus(parent,config.rules[selected])}}}
function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function safeName(){return (config.name||'baseline-configuration').replace(/[^a-zA-Z0-9_-]/g,'_')}
function field(parent,key,value,change){let row=node('div');row.className='field';let label=node('label',key.replaceAll('_',' '));let input;if(typeof value==='boolean'){input=node('select');['true','false'].forEach(v=>{let o=node('option',v);o.value=v;input.append(o)});input.value=String(value)}else{input=node(value!==null&&typeof value==='object'?'textarea':'input');input.value=value===null?'':typeof value==='object'?JSON.stringify(value,null,2):String(value);if(value===null||typeof value==='number')input.type='number'}input.onchange=()=>{try{let v=value===null?(input.value.trim()===''?null:Number(input.value)):typeof value==='boolean'?input.value==='true':typeof value==='number'?Number(input.value):typeof value==='object'?JSON.parse(input.value):input.value;if(typeof v==='number'&&!Number.isFinite(v))throw Error('Enter a finite number');change(v);status('Unsaved edits in this browser. Saving does not activate them in RTS.')}catch(e){status('Setting was not changed: '+e.message)}};row.append(label,input);parent.append(row)}
function navigate(){let nav=$('navigation');nav.replaceChildren();for(let [id,label] of [['overview','Configuration Overview'],...Object.entries(config.rules).map(([k,v])=>[k,v.label])]){let b=node('button',label);if(id===selected)b.className='selected';b.onclick=()=>{selected=id;render()};nav.append(b)}}
function ensureReservoirSlots(){let names=['Big Cliff','Blue River','Cottage Grove','Cougar','Detroit','Dexter','Dorena','Fall Creek','Fern Ridge','Foster','Green Peter','Hills Creek','Lookout Point'];let irrm=config.rules.irrm.settings;for(let name of names){if(!(name in irrm.active))irrm.active[name]=false;if(!(name in irrm.target_elevation_ft))irrm.target_elevation_ft[name]=null}let table=config.rules.deep_drawdown.tables.configuration;if(table.mode==='inline'){let ri=table.columns.indexOf('RESERVOIR'),ai=table.columns.indexOf('ACTIVE');for(let name of names){if(!table.rows.some(row=>row[ri]===name)){let row=table.columns.map(()=>null);row[ri]=name;row[ai]='FALSE';table.rows.push(row)}}}}
function render(){ensureReservoirSlots();navigate();let main=$('content');main.replaceChildren();if(selected==='overview'){let card=node('section');card.className='card';card.append(node('h2','One set of baseline rule settings'));field(card,'Configuration name',config.name,v=>config.name=v);field(card,'Description',config.description,v=>config.description=v);if(config.standalone_workflow){config.standalone_workflow={run_type:config.standalone_workflow.run_type||'ensemble',osi_source_member:config.standalone_workflow.osi_source_member};card.append(node('h3','Standalone job settings'),node('p','Simulation type: '+(config.standalone_workflow.run_type==='por'?'Single POR — OSI is not used.':'Ensemble — OSI destination is member 3003.')));if(config.standalone_workflow.run_type!=='por')field(card,'OSI source member',config.standalone_workflow.osi_source_member,v=>config.standalone_workflow.osi_source_member=v)}card.append(node('p','Includes all eleven scripted-rule groups. Forecast dates, ensemble members and augmentation settings are kept separately.'));main.append(card);let notice=node('p','Proposed workflow: save a set → apply in RTS with augmentation disabled → run an unaugmented simulation → accept results and archive the settings used. This mockup supports editing and export only.');notice.className='notice';main.append(notice);main.append(node('p','Daily schedules can be stored inside the set or linked to CSV files. Applying a linked CSV will validate and snapshot the actual file; an unavailable link must stop the apply operation.'));return}
let rule=config.rules[selected],card=node('section');card.className='card';card.append(node('h2',rule.label));if(rule.help){card.append(node('p',rule.help.purpose));let details=node('details');details.append(node('summary','How it works'),node('p',rule.help.how_it_works));card.append(details)}let hint=node('p','Unused IRRM and Deep Drawdown reservoir entries are inactive with blank settings. Off or incomplete entries impose no additional release requirement. Complete enabled entries operate normally. Configuration does not attach a native rule. Units are included in field names. Settings affect only locations where the rule is attached in ResSim.');hint.className='hint';card.append(hint);if(selected==='irrm'||selected==='deep_drawdown')drawOperatingStatus(card,rule);if(selected==='draft_to_rc')drawDraftActivation(card,rule);for(let [key,value]of Object.entries(rule.settings)){if(selected==='draft_to_rc'&&key==='active')continue;if(value&&typeof value==='object'&&Object.keys(value).length){card.append(node('h3',key.replaceAll('_',' ')));for(let [reservoir,setting]of Object.entries(value))field(card,reservoir,setting,v=>rule.settings[key][reservoir]=v)}else field(card,key,value,v=>rule.settings[key]=v);}if(!Object.keys(rule.settings).length)card.append(node('p','Settings for this rule are held in the table below.'));main.append(card);for(let [id,table]of Object.entries(rule.tables))drawTable(main,rule,id,table)}
function drawOperatingStatus(card,rule){let names=['Big Cliff','Blue River','Cottage Grove','Cougar','Detroit','Dexter','Dorena','Fall Creek','Fern Ridge','Foster','Green Peter','Hills Creek','Lookout Point'];let statuses=node('div');statuses.id='operating-state';statuses.className='notice';statuses.append(node('strong','Effective operation'));for(let name of names){let enabled,complete;if(selected==='irrm'){enabled=rule.settings.active[name]===true;complete=rule.settings.target_elevation_ft[name]!==null&&rule.settings.target_elevation_ft[name]!==undefined}else{let table=rule.tables.configuration;let row=table.rows.find(row=>row[table.columns.indexOf('RESERVOIR')]===name);enabled=row&&String(row[table.columns.indexOf('ACTIVE')]).toUpperCase()==='TRUE';complete=row&&table.columns.every((col,i)=>['RESERVOIR','ACTIVE','Notes','NOTES'].includes(col)||(row[i]!==null&&row[i]!==''))}statuses.append(node('div',name+': '+(!enabled?'Off — no additional requirement':!complete?'Not configured — no additional requirement':'On')))}card.append(statuses)}
function drawDraftActivation(card,rule){let mode=node('select');for(let [v,label]of [['all','One setting for all reservoirs'],['per','Set each reservoir separately']]){let option=node('option',label);option.value=v;mode.append(option)}let active=rule.settings.active;mode.value=typeof active==='object'?'per':'all';let row=node('div');row.className='field';row.append(node('label','Activation scope'),mode);card.append(row);mode.onchange=()=>{if(mode.value==='per'){let current=rule.settings.active;rule.settings.active=Object.fromEntries(['Big Cliff','Blue River','Cottage Grove','Cougar','Detroit','Dexter','Dorena','Fall Creek','Fern Ridge','Foster','Green Peter','Hills Creek','Lookout Point'].map(name=>[name,current]))}else{if(!confirm('Replace the per-reservoir choices with one global setting, initially enabled?')){mode.value='per';return}rule.settings.active=true}render();status('Activation edited in the mockup only. No model settings were changed.')};if(typeof active==='object'){for(let [name,enabled]of Object.entries(active))field(card,name,enabled,v=>rule.settings.active[name]=v);let note=node('p','A reservoir omitted from an activation map remains enabled in the current script. These choices do not add the rule to a reservoir’s rule stack.');note.className='hint';card.append(note)}else field(card,'Enabled at all attached reservoirs',active,v=>rule.settings.active=v)}
function drawTable(main,rule,id,table){let card=node('section');card.className='card';card.append(node('h3',id.replaceAll('_',' ')));let mode=node('select');for(let [v,label]of [['inline','Table saved in JSON'],['csv','Link to a CSV file']]){let o=node('option',label);o.value=v;mode.append(o)}mode.value=table.mode;mode.onchange=()=>{table.mode=mode.value;render()};let top=node('div');top.className='tablebar';top.append(node('span','Source'),mode);card.append(top);if(table.mode==='csv'){field(card,'CSV path',table.csv_path||'',v=>table.csv_path=v);let browse=node('button','Browse CSV for Preview');browse.onclick=()=>{pendingCSV=table;$('csvfile').value='';$('csvfile').click()};card.append(browse);let hint=node('p','Linked file preview only. The production adapter will reread the actual link when applying. Choose a file to preview; this browser cannot read a typed path.');hint.className='hint';card.append(hint)}let controls=node('div');controls.className='tablebar';controls.append(node('span',table.rows.length+' rows · Blank cells remain blank; zero is a value.'));let reservoir=node('select');let all=node('option','All columns');all.value='';reservoir.append(all);let daily=table.columns[0]==='Month'&&table.columns[1]==='Day';if(daily){table.columns.slice(2).forEach((c,i)=>{let o=node('option',c);o.value=String(i+2);reservoir.append(o)});controls.append(node('span','Reservoir / element'),reservoir)}let wrap=node('div');wrap.className='tablewrap';function fill(){wrap.replaceChildren();let grid=node('table'),head=node('tr');let cols=daily&&reservoir.value!==''?[0,1,Number(reservoir.value)]:table.columns.map((_,i)=>i);cols.forEach(i=>head.append(node('th',table.columns[i])));let thead=node('thead');thead.append(head);grid.append(thead);let body=node('tbody');table.rows.forEach(row=>{let tr=node('tr');cols.forEach(i=>{let td=node('td'),input=node('input');input.value=row[i]===null?'':row[i];input.disabled=table.mode==='csv';input.onchange=()=>{row[i]=input.value===''?null:input.value;status('Table edited. Production validation will check dates, names and values before apply.')};td.append(input);tr.append(td)});body.append(tr)});grid.append(body);wrap.append(grid)}reservoir.onchange=fill;fill();card.append(controls,wrap);main.append(card)}
function parseCSV(text){let rows=[],row=[],cell='',quoted=false;text=text.replace(/^\uFEFF/,'');for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(!quoted&&(c===','||c==='\n'||c==='\r')){row.push(cell);cell='';if(c!==','){if(c==='\r'&&text[i+1]==='\n')i++;rows.push(row);row=[]}}else cell+=c}if(quoted)throw Error('Unclosed CSV quote');if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()!=='')&&!r[0].trimStart().startsWith('#'))}
$('open').onclick=()=>{$('jsonfile').value='';$('jsonfile').click()};$('jsonfile').onchange=async e=>{try{let next=JSON.parse(await e.target.files[0].text());if(next.format!=='rts-baseline-configuration'||next.schema_version!==1||!next.rules)throw Error('Choose a schema-version-1 baseline configuration');for(let rule of Object.values(next.rules)){if(!rule.settings||!rule.tables)throw Error('Missing rule settings/tables');for(let table of Object.values(rule.tables)){if(!['csv','inline'].includes(table.mode)||!Array.isArray(table.columns)||!Array.isArray(table.rows)||table.rows.some(r=>!Array.isArray(r)||r.length!==table.columns.length))throw Error('Invalid table structure')}}config=next;selected='overview';render();status('JSON opened. This is structural validation only; the RTS adapter is not installed.')}catch(e){status('Could not open JSON: '+e.message)}};
$('save').onclick=()=>{download(safeName()+'.json',JSON.stringify(config,null,2)+'\n','application/json');status('JSON downloaded. No model settings were activated.')};
$('csvfile').onchange=async e=>{try{let file=e.target.files[0],rows=parseCSV(await file.text());if(rows.length<2)throw Error('CSV needs a header and at least one data row');let columns=rows.shift();if(rows.some(r=>r.length!==columns.length))throw Error('CSV rows have unequal widths');pendingCSV.columns=columns;pendingCSV.rows=rows.map(r=>r.map(v=>v.trim()===''?null:v));status('CSV preview loaded: '+file.name+'. Enter its actual runtime path before saving a linked set.');render()}catch(e){status('CSV preview failed: '+e.message)}};
$('summary').onclick=()=>{let page=document.implementation.createHTMLDocument(config.name),style=node('style','body{font:15px system-ui;margin:30px;color:#243247}table{border-collapse:collapse;font-size:12px}td,th{padding:5px;border:1px solid #ccc}section{margin-bottom:30px}');page.head.append(style);page.body.append(node('h1',config.name),node('p',config.description),node('p','Configuration summary — design format. Not an RTS compute record. Linked tables show the saved preview; actual linked file values may have changed.'));for(let rule of Object.values(config.rules)){let section=node('section');section.append(node('h2',rule.label));if(rule.help)section.append(node('p',rule.help.purpose),node('p','How it works: '+rule.help.how_it_works));let list=node('dl');for(let [key,val]of Object.entries(rule.settings)){if(val&&typeof val==='object'){list.append(node('dt',key.replaceAll('_',' ')));for(let [reservoir,setting]of Object.entries(val))list.append(node('dd',reservoir+': '+String(setting)));if(!Object.keys(val).length)list.append(node('dd','No overrides'))}else list.append(node('dt',key.replaceAll('_',' ')),node('dd',String(val)))}section.append(list);for(let [id,table]of Object.entries(rule.tables)){section.append(node('h3',id.replaceAll('_',' ')),node('p',table.mode==='csv'?'Linked CSV (saved preview): '+table.csv_path:'Inline table'));let grid=node('table'),head=node('tr');table.columns.forEach(c=>head.append(node('th',c)));grid.append(head);table.rows.forEach(row=>{let tr=node('tr');row.forEach(v=>tr.append(node('td',v===null?'(blank)':String(v))));grid.append(tr)});section.append(grid)}page.body.append(section)}download(safeName()+'-summary.html','<!doctype html>'+page.documentElement.outerHTML,'text/html');status('Readable summary downloaded. Open it in a browser without RTS.')};render();
</script></html>
