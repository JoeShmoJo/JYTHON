Name=FRM_Base_E
Description=Ensemble version simulates many different flood events with different inflows and starting pool. See ../3.7_Synthetics_ResSim_Inputs for a legend on what each run is.
Description=FRM Baseline Conditions for Willamette FIRO Study. 3 hour timestep suitable for flood event modeling.
Description=Operations reflect FRM Baseline conditions (see documentation).
Description=Make sure to turn all DSS output off if you want to run a full ensemble on one computer.
Description=Otherwise, the output DSS file will get huge and ResSim will choke.
Description=To run this simulation, we have to "trick" ResSim a little bit.
Description=If we created a simulation traditionally,
Description=Ressim will try to extract all timeseries for every ensemble event from the input .dss file with all inflows/elevations.
Description=This would take a long time.
Description=Rather than doing that, it is best to do the following:
Description=1. Set up the ensemble alternative so it is only referencing a single event, like "000001", in the "Ensemble" tab.
Description=2. Create the simulation:
Description=Start date: 01Jan3000 1200
Description=Lookback: 01Jan3000 0300
Description=End Date: 16Jan3000 0000
Description=3. In the simulation module, change the "Ensemble" tab of the alternative back to what it should be (e.g. "000001-0017187")
Description=4. Close down ResSim
Description=5. Copy the input .dss file with all inputs needed to the "../rss/$SIM_NAME$" folder. This is usually from "../3.7_Synthetics_ResSim_Inputs\out"
Description=Rename it "simulation.dss". Delete the existing "simulation.dss" file.
Description=6. Re-open ResSim and then run
Description=7. When running multi-thread ensemble compute, Ressim will usually fail before it gets all the way through:
Description=Not exactly sure why this happens, likely some memory issue
Description=Doesn't have a problem if running single-thread, but much slower.
Description=8. After the run fails, run the "../scripts/Utilities/PrintMissingEnsembles.py" script.
Description=It spits out a string showing all the runs that failed, e.g. "000069-001075, 001084, ..."
Description=9. Copy this text of the failed runs into the "Ensemble" tab in ResSim in the simulation, and run again
Description=10. Repeat as many times as needed until all ensemble members are completed.
Description=11. The results for each simulation are stored in the "../rss/$SIM_NAME$/PeakExtract.csv", which is appended with every completed ensemble member.
Description=If you need to re-run a simulation, delete out this file first, otherwise we'll have duplicates in the file. (Global Variable Data Set)
